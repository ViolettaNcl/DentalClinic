services:
  # ================= База данных =================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dentalclinic-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - dentalclinic-db-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ================= Приложение =================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentalclinic-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # Двойное подчёркивание "__" вместо ":" — так ASP.NET Core читает вложенные
      # ключи конфигурации из переменных окружения (см. docs/DEPLOYMENT.md).
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=DentalClinic;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "DentalClinic"
      Jwt__Audience: "DentalClinicClient"
      Jwt__ExpiryMinutes: "120"
      Gemini__ApiKey: "${GEMINI_API_KEY}"
      ElevenLabs__ApiKey: "${ELEVENLABS_API_KEY:-}"
      AllowedOrigins__0: "${FRONTEND_ORIGIN:-http://localhost:8080}"
    volumes:
      # Аватары должны переживать пересоздание контейнера
      - dentalclinic-uploads:/app/wwwroot/uploads

volumes:
  dentalclinic-db-data:
  dentalclinic-uploads:
