<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="DentalClinic architecture">
<style>
  .flow{animation:flow 1.6s linear infinite}.flowr{animation:flow 1.6s linear infinite reverse}
  @keyframes flow{to{stroke-dashoffset:-32}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) backwards}
  @keyframes pop{from{opacity:0;transform:scale(.9)}}
  .row{animation:row 6s ease-in-out infinite}
  @keyframes row{0%,100%{fill-opacity:.0}12%{fill-opacity:.16}24%{fill-opacity:0}}
  .core{transform-box:fill-box;transform-origin:center;animation:breath 4s ease-in-out infinite}
  @keyframes breath{50%{stroke-opacity:.95}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020a09"/><stop offset="1" stop-color="#082420"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2420"/><stop offset="1" stop-color="#08130f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13b39b"/><stop offset=".5" stop-color="#5fd9c4"/><stop offset="1" stop-color="#ffb672"/></linearGradient>
  <radialGradient id="ga"><stop offset="0" stop-color="#13b39b" stop-opacity=".28"/><stop offset="1" stop-color="#13b39b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5fd9c4" stroke-opacity=".05"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
