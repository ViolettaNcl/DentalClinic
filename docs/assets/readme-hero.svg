<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DentalClinic animated project banner</title>
  <desc id="desc">DentalClinic production-oriented dental platform with patient portal, clinic CRM, realtime notifications and bounded AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020706"/>
      <stop offset="0.48" stop-color="#071411"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13b39b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5fd9c4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#13b39b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#13b39b" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#13b39b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#5fd9c4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <circle cx="1030" cy="75" r="190" fill="url(#glow)" filter="url(#blur)">
      <animate attributeName="cx" values="1030;970;1030" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="75;118;75" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="235" cy="325" r="155" fill="url(#glow)" opacity="0.44" filter="url(#blur)">
      <animate attributeName="cx" values="235;305;235" dur="12s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="-12" width="1200" height="2" fill="url(#line)" opacity="0">
      <animate attributeName="y" values="-12;372" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.28;0.28;0" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(62 62)">
      <circle cx="58" cy="58" r="55" fill="#0b1c18" stroke="#13b39b" stroke-opacity="0.42"/>
      <circle cx="58" cy="58" r="43" fill="none" stroke="#5fd9c4" stroke-opacity="0.16" stroke-dasharray="4 7">
        <animateTransform attributeName="transform" type="rotate" from="0 58 58" to="360 58 58" dur="18s" repeatCount="indefinite"/>
      </circle>
      <path d="M58 23c-14 0-25 9-25 24 0 10 4 18 8 27 5 11 7 25 12 25 4 0 4-18 9-18s5 18 9 18c5 0 7-14 12-25 4-9 8-17 8-27 0-15-11-24-25-24-4 0-6 2-8 2s-4-2-8-2Z" fill="none" stroke="#5fd9c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="58" r="4" fill="#ffb672">
        <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="200" y="92" fill="#dffaf5" font-size="52" font-weight="800" letter-spacing="-1.2">DentalClinic</text>
      <text x="202" y="128" fill="#8fbbb3" font-size="19" font-weight="500">Production-oriented dental platform</text>

      <g transform="translate(202 158)" font-size="14" font-weight="700">
        <rect width="132" height="34" rx="17" fill="#0f2d27" stroke="#13b39b" stroke-opacity="0.38"/>
        <circle cx="18" cy="17" r="5" fill="#13b39b">
          <animate attributeName="opacity" values="0.45;1;0.45" dur="1.7s" repeatCount="indefinite"/>
        </circle>
        <text x="31" y="22" fill="#bfeee6">ASP.NET 10</text>

        <g transform="translate(144 0)">
          <rect width="148" height="34" rx="17" fill="#0f2d27" stroke="#13b39b" stroke-opacity="0.38"/>
          <circle cx="18" cy="17" r="5" fill="#5fd9c4">
            <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <text x="31" y="22" fill="#bfeee6">SignalR realtime</text>
        </g>

        <g transform="translate(304 0)">
          <rect width="125" height="34" rx="17" fill="#2b2217" stroke="#ffb672" stroke-opacity="0.45"/>
          <circle cx="18" cy="17" r="5" fill="#ffb672">
            <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
          </circle>
          <text x="31" y="22" fill="#ffd8b5">Gemini AI</text>
        </g>
      </g>

      <text x="202" y="232" fill="#eefbf8" font-size="18" font-weight="650">Patient Portal  •  Clinic CRM  •  Realtime  •  Denta AI</text>
      <text x="202" y="262" fill="#6f9f96" font-size="14">Secure sessions · multilingual UX · durable notifications · operational tooling</text>

      <g transform="translate(202 292)" font-size="12" font-weight="700" letter-spacing="0.4">
        <rect width="124" height="28" rx="14" fill="#0c201c" stroke="#17453b"/>
        <text x="18" y="19" fill="#86cfc2">PATIENT PORTAL</text>
        <g transform="translate(136 0)"><rect width="104" height="28" rx="14" fill="#0c201c" stroke="#17453b"/><text x="18" y="19" fill="#86cfc2">CLINIC CRM</text></g>
        <g transform="translate(252 0)"><rect width="124" height="28" rx="14" fill="#0c201c" stroke="#17453b"/><text x="18" y="19" fill="#86cfc2">SECURE SESSIONS</text></g>
        <g transform="translate(388 0)"><rect width="116" height="28" rx="14" fill="#0c201c" stroke="#17453b"/><text x="18" y="19" fill="#86cfc2">MULTILINGUAL</text></g>
      </g>
    </g>

    <g transform="translate(850 62)" fill="none" stroke-linecap="round">
      <path d="M45 70C92 15 190 20 238 74S306 167 252 222 105 264 49 216 1 125 45 70Z" stroke="#13b39b" stroke-opacity="0.16" stroke-width="1.4" stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;-84" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M82 94L151 58 220 100 252 163 190 211 108 206 54 150Z" stroke="#5fd9c4" stroke-opacity="0.32"/>
      <path d="M151 58L154 137M82 94L154 137M220 100L154 137M252 163L154 137M190 211L154 137M108 206L154 137M54 150L154 137" stroke="#13b39b" stroke-opacity="0.20"/>
      <g fill="#13b39b" stroke="none">
        <circle cx="82" cy="94" r="5"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="151" cy="58" r="4" opacity="0.8"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="220" cy="100" r="5"><animate attributeName="r" values="5;3;5" dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="252" cy="163" r="4" opacity="0.75"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="190" cy="211" r="5"><animate attributeName="r" values="4;7;4" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="108" cy="206" r="4" opacity="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
        <circle cx="54" cy="150" r="5"><animate attributeName="r" values="5;3;5" dur="2.2s" repeatCount="indefinite"/></circle>
      </g>
      <circle cx="154" cy="137" r="18" fill="#0d2a24" stroke="#5fd9c4" stroke-opacity="0.7"/>
      <circle cx="154" cy="137" r="6" fill="#ffb672" stroke="none">
        <animate attributeName="r" values="5;8;5" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#5fd9c4" stroke-opacity="0.14"/>
  </g>
</svg>
