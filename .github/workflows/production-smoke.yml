name: Production Smoke

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_ORIGIN: https://dental-clinic-vn.vercel.app
      PRODUCTION_HTTP_ORIGIN: http://dental-clinic-vn.vercel.app
    steps:
      - name: Wait for healthy production and current canonical domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            echo "Production smoke attempt ${attempt}/24"
            health="$(curl --silent --show-error --fail --max-time 20 "${PRODUCTION_ORIGIN}/health" 2>/dev/null || true)"
            home="$(curl --silent --show-error --fail --max-time 20 "${PRODUCTION_ORIGIN}/" 2>/dev/null || true)"
            if printf '%s' "$health" | grep -q '"status":"Healthy"' \
              && printf '%s' "$health" | grep -q '"name":"db"' \
              && printf '%s' "$home" | grep -q 'https://dental-clinic-vn.vercel.app/'; then
              echo "Production is healthy and serving the canonical domain."
              printf '%s\n' "$health"
              exit 0
            fi
            sleep 15
          done
          echo "Production did not become healthy/current before timeout." >&2
          exit 1

      - name: Verify all primary page shells and service pages
        shell: bash
        run: |
          set -euo pipefail

          pages=(
            "/"
            "/pages/about.html"
            "/pages/contact.html"
            "/pages/doctors.html"
            "/pages/services.html"
            "/pages/patient-dashboard.html"
            "/pages/admin-dashboard.html"
            "/pages/services/bridges.html"
            "/pages/services/cosmetic-treatments.html"
            "/pages/services/crowns.html"
            "/pages/services/extractions.html"
            "/pages/services/fillings.html"
            "/pages/services/implants.html"
            "/pages/services/prosthetics.html"
            "/pages/services/root-canal.html"
          )

          for path in "${pages[@]}"; do
            echo "Checking ${path}"
            headers="$(mktemp)"
            body="$(mktemp)"
            curl --silent --show-error --fail --max-time 20 \
              --dump-header "$headers" \
              --output "$body" \
              "${PRODUCTION_ORIGIN}${path}"

            grep -qi '<html' "$body" || {
              echo "${path} did not return an HTML page." >&2
              cat "$body" >&2
              exit 1
            }

            grep -qi '^x-content-type-options:[[:space:]]*nosniff' "$headers" || {
              echo "${path} is missing X-Content-Type-Options: nosniff." >&2
              cat "$headers" >&2
              exit 1
            }

            grep -qi '^x-frame-options:[[:space:]]*SAMEORIGIN' "$headers" || {
              echo "${path} is missing X-Frame-Options: SAMEORIGIN." >&2
              cat "$headers" >&2
              exit 1
            }

            grep -qi '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' "$headers" || {
              echo "${path} is missing the expected Referrer-Policy." >&2
              cat "$headers" >&2
              exit 1
            }

            rm -f "$headers" "$body"
          done

          echo "All primary page shells and service pages are reachable with the expected browser security headers."

      - name: Verify public API surface remains reachable
        shell: bash
        run: |
          set -euo pipefail
          for path in "/api/service" "/api/doctor"; do
            echo "Checking ${path}"
            body="$(curl --silent --show-error --fail --max-time 20 "${PRODUCTION_ORIGIN}${path}")"
            printf '%s' "$body" | grep -Eq '^\s*[\[{]' || {
              echo "${path} did not return JSON-like content." >&2
              printf '%s\n' "$body" >&2
              exit 1
            }
          done

      - name: Verify HTTP redirects to HTTPS
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --silent --show-error --head --max-time 20 --write-out '%{http_code} %{redirect_url}' --output /dev/null "${PRODUCTION_HTTP_ORIGIN}/")"
          code="${result%% *}"; redirect="${result#* }"
          case "$code" in 301|302|307|308) ;; *) echo "Expected HTTP redirect, got ${code}." >&2; exit 1 ;; esac
          case "$redirect" in https://dental-clinic-vn.vercel.app/*) ;; *) echo "HTTP did not redirect to HTTPS production." >&2; exit 1 ;; esac
