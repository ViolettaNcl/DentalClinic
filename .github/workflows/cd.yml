name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ "main" ]
    types: [ completed ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run tests (gate before deploy)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore DentalClinic.Tests/DentalClinic.Tests.csproj
      - run: dotnet test DentalClinic.Tests/DentalClinic.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  deploy-ftp:
    name: Deploy (FTP → somee.com)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore DentalClinic.csproj
      - run: dotnet publish DentalClinic.csproj -c Release -o ./publish
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/appsettings.Development.json
            **/*.pdb

  docker-image:
    name: Build & push Docker image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
