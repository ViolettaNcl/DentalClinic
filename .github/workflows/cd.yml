name: CD

# Запускается только ПОСЛЕ успешного завершения workflow "CI" (build) на ветке main.
# Делает две независимые вещи:
#   1. deploy-ftp  — публикует dotnet publish на текущий хостинг (somee.com) по FTP.
#   2. docker-image — собирает и пушит Docker-образ в GitHub Container Registry
#      (ghcr.io) — пригодится, если в будущем переедете на VPS/Docker-хостинг.
# Ни один job не требует другого — можно включить/отключить нужный.

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ "main" ]
    types: [ completed ]
  workflow_dispatch: {}

jobs:
  deploy-ftp:
    name: Deploy (FTP → somee.com)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Включайте этот job, только если задали секреты FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
    # (Settings → Secrets and variables → Actions). Пока секретов нет — job аккуратно
    # завершится ошибкой на шаге деплоя, ничего не сломав в репозитории.
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish DentalClinic.csproj -c Release -o ./publish

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          # На somee.com сайт публикуется в подпапку www.<сайт>.somee.com — см.
          # Properties/PublishProfiles/FTPProfile.pubxml (FtpSitePath)
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/appsettings.Development.json
            **/*.pdb

  docker-image:
    name: Build & push Docker image (GHCR)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dentalclinic:latest
            ghcr.io/${{ github.repository_owner }}/dentalclinic:${{ github.sha }}
