name: Production E2E

on:
  # Once a day (was every 6 h and on every push). While Vercel Git deployments
  # are paused a push does not change production, so a push-triggered run only
  # spent the Hobby plan's CPU/memory budget. Run it manually after a deploy.
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for production deployment
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --max-time 15 https://dental-clinic-vn.vercel.app/health | grep -q '"status":"Healthy"'; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Run Playwright E2E
        env:
          BASE_URL: https://dental-clinic-vn.vercel.app
        run: npx playwright test --project=chromium --project=mobile
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
