name: Production E2E

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for production deployment
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --max-time 15 https://dental-clinic-vn.vercel.app/health | grep -q '"status":"Healthy"'; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Run Playwright E2E
        env:
          BASE_URL: https://dental-clinic-vn.vercel.app
        run: npx playwright test --project=chromium --project=mobile
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
