name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies (app)
        run: dotnet restore DentalClinic.csproj

      - name: Build (app)
        run: dotnet build DentalClinic.csproj --no-restore --configuration Release

      - name: Build Vercel container image
        run: docker build --file Dockerfile.vercel --tag dental-clinic:ci .

      - name: Verify EF Core migrations are discoverable
        env:
          ConnectionStrings__DefaultConnection: "Server=(localdb)\\mssqllocaldb;Database=DentalClinicCi;Trusted_Connection=True;"
          Jwt__Key: "ci-only-jwt-key-with-at-least-thirty-two-bytes"
          Jwt__Issuer: "DentalClinicCI"
          Jwt__Audience: "DentalClinicCI"
        run: |
          dotnet tool restore
          dotnet ef migrations list --project DentalClinic.csproj --no-build --configuration Release --no-connect

      - name: Restore dependencies (tests)
        run: dotnet restore DentalClinic.Tests/DentalClinic.Tests.csproj

      - name: Run API/.NET tests
        run: dotnet test DentalClinic.Tests/DentalClinic.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Run JavaScript unit tests
        run: npm run test:js
