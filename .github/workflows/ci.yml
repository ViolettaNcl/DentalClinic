name: CI

# Простой CI: проверяет, что проект собирается на каждый push и Pull Request.
# Не деплоит и не трогает базу данных — только компиляция, чтобы сразу видеть
# сломанную сборку прямо в интерфейсе GitHub (зелёная/красная галочка у коммита).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies (app)
        run: dotnet restore DentalClinic.csproj

      - name: Build (app)
        run: dotnet build DentalClinic.csproj --no-restore --configuration Release

      - name: Restore dependencies (tests)
        run: dotnet restore DentalClinic.Tests/DentalClinic.Tests.csproj

      - name: Run tests
        run: dotnet test DentalClinic.Tests/DentalClinic.Tests.csproj --configuration Release --logger "console;verbosity=normal"
