name: One-time patch review notification order

on:
  push:
    branches:
      - fix/review-realtime-after-commit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source ordering
        run: node scripts/patch-review-notification-order.mjs
      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/NotificationService.cs Controllers/ReviewController.cs
          git commit -m "Deliver review realtime only after transaction commit"
          git push origin HEAD:fix/review-realtime-after-commit
