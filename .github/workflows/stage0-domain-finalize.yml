name: Stage 0 domain finalizer

on:
  push:
    branches:
      - chore/stage0-1-finalize

permissions:
  contents: write

jobs:
  normalize-production-domain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace obsolete production host in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          OLD_SUFFIX="violettancls-projects.vercel.app"
          OLD_HOST="dental-clinic-${OLD_SUFFIX}"
          NEW_HOST="dental-clinic-vn.vercel.app"

          mapfile -t files < <(git grep -Il "$OLD_HOST" || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No obsolete production-domain references found."
            exit 0
          fi

          printf 'Updating %s tracked text files:\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"

          python3 - "$OLD_HOST" "$NEW_HOST" "${files[@]}" <<'PY'
          import pathlib
          import sys

          old, new, *paths = sys.argv[1:]
          for raw_path in paths:
              path = pathlib.Path(raw_path)
              text = path.read_text(encoding="utf-8-sig")
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "chore(stage0): use canonical production domain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
